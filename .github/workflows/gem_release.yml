name: Release Gem

on:
  # Auto-publish when a version tag lands (e.g. `git push origin v2.2.1`).
  push:
    tags:
      - v*
  # Manual trigger — useful for republishing after a transient upload
  # failure, or for the first release after trusted publishing is set up
  # (the tag may have been pushed before this workflow existed).
  workflow_dispatch:

jobs:
  run-tests:
    uses: ./.github/workflows/ruby_test.yml
    with:
      ruby-version: '3.4.4'

  release:
    name: Release to RubyGems
    needs: run-tests
    runs-on: ubuntu-latest
    permissions:
      # Required for OIDC trusted publishing to RubyGems — the action
      # requests a short-lived token that RubyGems verifies came from THIS
      # workflow in THIS repo, replacing the long-lived RUBYGEMS_API_KEY
      # secret we used previously.
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ruby
          ruby-version: '3.4.4'
          bundler-cache: true

      # Publishes via OIDC — no RUBYGEMS_API_KEY secret needed. Requires a
      # matching Trusted Publisher configured on rubygems.org for this gem,
      # pointed at repo `pubannotation/simple_inline_annotation_format`,
      # workflow `.github/workflows/gem_release.yml`.
      # Docs: https://guides.rubygems.org/trusted-publishing/
      - name: Release Gem
        uses: rubygems/release-gem@v1
        with:
          working-directory: ruby
